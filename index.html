<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>NOTES</title>

  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />

  <link rel="stylesheet" href="./style.css" />

  <style>
    .auth-section {
      max-width: 600px;
      margin: 0 auto 30px;
      padding: 20px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    .auth-title {
      margin: 0 0 15px;
      text-align: center;
    }

    .auth-inputs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .auth-input {
      flex: 1;
      min-width: 200px;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      box-sizing: border-box;
    }

    .auth-buttons {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .auth-button {
      border: none;
      padding: 11px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .login-button {
      background: #667eea;
      color: white;
    }

    .signup-button {
      background: #667eea;
      color: white;
    }

    .logout-button {
      background: #667eea;
      color: white;
      display: none;
    }

    .auth-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .auth-status {
      margin-top: 12px;
      min-height: 20px;
      text-align: center;
      font-size: 14px;
    }

    .auth-error {
      color: #e53e3e;
    }

    .auth-success {
      color: #38a169;
    }
  </style>
</head>

<body>
  <div class="container">

    <header class="header">
      <h1>NOTES</h1>
      <p>notes for loosers and chuds ONLY</p>
    </header>

    <!-- AUTHENTICATION -->
    <div class="auth-section">
      <h3 class="auth-title">Your Account</h3>

      <div class="auth-inputs">
        <input
          type="email"
          id="emailInput"
          class="auth-input"
          placeholder="Email"
          autocomplete="email"
        />

        <input
          type="password"
          id="passwordInput"
          class="auth-input"
          placeholder="Password"
          autocomplete="current-password"
        />
      </div>

      <div class="auth-buttons">
        <button
          type="button"
          id="loginBtn"
          class="auth-button login-button"
        >
          Log in
        </button>

        <button
          type="button"
          id="signupBtn"
          class="auth-button signup-button"
        >
          Sign up
        </button>

        <button
          type="button"
          id="logoutBtn"
          class="auth-button logout-button"
        >
          Log out
        </button>
      </div>

      <div id="authStatus" class="auth-status"></div>
    </div>

    <!-- APP -->
    <div id="appContent">

      <div class="controls">
        <div class="controls-container">
          <input
            type="text"
            id="searchInput"
            placeholder="Search notes..."
            class="search-input"
          />

          <div class="filter-group">
            <select id="filterSelect" class="filter-select">
              <option value="all">All notes</option>
              <option value="school">School</option>
              <option value="random">Random</option>
              <option value="ideas">Ideas</option>
              <option value="reminders">Reminders</option>
            </select>

            <button id="addNoteBtn" class="add-btn" type="button">
              <i class="fas fa-plus"></i>
              Add
            </button>
          </div>
        </div>
      </div>

      <div id="notesContainer" class="notes-grid"></div>

      <div id="emptyState" class="empty-state">
        <i class="fas fa-notes-medical"></i>
        <h3>No Notes</h3>
        <p>Add a note</p>
      </div>

      <!-- ADD NOTE MODAL -->
      <div id="addNoteModal" class="modal-overlay">
        <div class="modal">

          <div class="modal-header">
            <h3 class="modal-title">New Note</h3>

            <button
              id="closeModalBtn"
              class="modal-close"
              type="button"
            >
              <i class="fas fa-times"></i>
            </button>
          </div>

          <form id="noteForm" class="modal-body">

            <div class="form-group">
              <label for="noteTitle" class="form-label">
                Title
              </label>

              <input
                type="text"
                id="noteTitle"
                class="form-input"
                required
              />
            </div>

            <div class="form-group">
              <label for="noteContent" class="form-label">
                Content
              </label>

              <textarea
                id="noteContent"
                class="form-input form-textarea"
                required
              ></textarea>
            </div>

            <div class="form-group">
              <label class="form-label">
                Tags
              </label>

              <div class="tags-container">

                <label class="tag-option">
                  <input
                    type="radio"
                    name="noteTag"
                    value="school"
                    class="tag-radio"
                  />

                  <span class="tag-label tag-school">
                    <i class="fas fa-briefcase"></i>
                    School
                  </span>
                </label>

                <label class="tag-option">
                  <input
                    type="radio"
                    name="noteTag"
                    value="random"
                    class="tag-radio"
                  />

                  <span class="tag-label tag-random">
                    <i class="fas fa-user"></i>
                    Random
                  </span>
                </label>

                <label class="tag-option">
                  <input
                    type="radio"
                    name="noteTag"
                    value="ideas"
                    class="tag-radio"
                    checked
                  />

                  <span class="tag-label tag-ideas">
                    <i class="fas fa-lightbulb"></i>
                    Ideas
                  </span>
                </label>

                <label class="tag-option">
                  <input
                    type="radio"
                    name="noteTag"
                    value="reminders"
                    class="tag-radio"
                  />

                  <span class="tag-label tag-reminders">
                    <i class="fas fa-bell"></i>
                    Reminder
                  </span>
                </label>

              </div>
            </div>

            <button
              type="submit"
              class="submit-btn"
            >
              Save Note
            </button>

          </form>
        </div>
      </div>

      <!-- DELETE MODAL -->
      <div id="confirmModal" class="modal-overlay">

        <div class="modal confirmation-modal">

          <div class="modal-body">

            <p class="confirmation-text">
              Are you sure you want to delete this note?
            </p>

            <div class="confirmation-buttons">

              <button
                id="cancelDeleteBtn"
                class="confirmation-btn cancel-btn"
                type="button"
              >
                Cancel
              </button>

              <button
                id="confirmDeleteBtn"
                class="confirmation-btn confirm-btn"
                type="button"
              >
                Delete
              </button>

            </div>

          </div>

        </div>
      </div>

    </div>
  </div>

  <!-- Supabase MUST load before index.js -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="./index.js"></script>
  <audio controls autoplay>
    <source src="1-02 Ascension.mp3" type="audio/mpeg">
  </audio>

  <a href="ideas/">IDEAS</a>

  </body>
</html>
