<!DOCTYPE html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Elegant Notes</title>


<link
  rel="stylesheet"
  href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
/>
<link rel="stylesheet" href="./style.css" />

<style>
  .auth-panel {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin: 0 auto 20px;
    max-width: 500px;
    flex-wrap: wrap;
  }

  .auth-panel input {
    padding: 10px 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    flex: 1;
    min-width: 180px;
  }

  .auth-btn {
    padding: 10px 16px;
    border: none;
    border-radius: 8px;
    background: #6c63ff;
    color: white;
    cursor: pointer;
    font-weight: 600;
  }

  .auth-btn:hover {
    opacity: 0.9;
  }

  .logout-btn {
    background: #555;
  }

  .auth-status {
    width: 100%;
    text-align: center;
    font-size: 14px;
    color: #666;
  }

  .user-email {
    font-weight: 600;
    color: #444;
  }

  .auth-error {
    color: #d9534f;
  }

  .auth-success {
    color: #28a745;
  }

  #appContent {
    transition: opacity 0.2s ease;
  }

  .logged-out {
    opacity: 0.55;
    pointer-events: none;
  }
</style>


  </head>

  <body>
    <div class="container">
      <header class="header">
        <h1>Elegant Notes</h1>
        <p>Store your thoughts and ideas in style</p>
      </header>


  <!-- Supabase authentication -->
  <div class="auth-panel">
    <input
      type="email"
      id="emailInput"
      placeholder="Email"
      autocomplete="email"
    />

    <input
      type="password"
      id="passwordInput"
      placeholder="Password"
      autocomplete="current-password"
    />

    <button id="loginBtn" class="auth-btn">
      Log in
    </button>

    <button id="signupBtn" class="auth-btn">
      Sign up
    </button>

    <button id="logoutBtn" class="auth-btn logout-btn" style="display: none;">
      Log out
    </button>

    <div id="authStatus" class="auth-status">
      Please log in or create an account.
    </div>
  </div>

  <div id="appContent" class="logged-out">
    <div class="controls">
      <div class="controls-container">
        <input
          type="text"
          id="searchInput"
          placeholder="Search notes..."
          class="search-input"
        />

        <div class="filter-group">
          <select id="filterSelect" class="filter-select">
            <option value="all">All notes</option>
            <option value="school">School</option>
            <option value="random">Random</option>
            <option value="ideas">Ideas</option>
            <option value="reminders">Reminders</option>
          </select>

          <button id="addNoteBtn" class="add-btn">
            <i class="fas fa-plus"></i> Add
          </button>
        </div>
      </div>
    </div>

    <div id="notesContainer" class="notes-grid">
      <!-- Notes will be added here dynamically -->
    </div>

    <div id="emptyState" class="empty-state">
      <i class="fas fa-notes-medical"></i>
      <h3>No Notes</h3>
      <p>Add a note</p>
    </div>

    <!-- Add note modal -->
    <div id="addNoteModal" class="modal-overlay">
      <div class="modal">
        <div class="modal-header">
          <h3 class="modal-title">New Note</h3>

          <button id="closeModalBtn" class="modal-close">
            <i class="fas fa-times"></i>
          </button>
        </div>

        <form id="noteForm" class="modal-body">
          <div class="form-group">
            <label for="noteTitle" class="form-label">Title</label>

            <input
              type="text"
              id="noteTitle"
              class="form-input"
              required
            />
          </div>

          <div class="form-group">
            <label for="noteContent" class="form-label">
              Content
            </label>

            <textarea
              id="noteContent"
              class="form-input form-textarea"
              required
            ></textarea>
          </div>

          <div class="form-group">
            <label class="form-label">Tags</label>

            <div class="tags-container">
              <label class="tag-option">
                <input
                  type="radio"
                  name="noteTag"
                  value="school"
                  class="tag-radio"
                />

                <span class="tag-label tag-school">
                  <i class="fas fa-briefcase"></i> School
                </span>
              </label>

              <label class="tag-option">
                <input
                  type="radio"
                  name="noteTag"
                  value="random"
                  class="tag-radio"
                />

                <span class="tag-label tag-random">
                  <i class="fas fa-user"></i> Random
                </span>
              </label>

              <label class="tag-option">
                <input
                  type="radio"
                  name="noteTag"
                  value="ideas"
                  class="tag-radio"
                  checked
                />

                <span class="tag-label tag-ideas">
                  <i class="fas fa-lightbulb"></i> Ideas
                </span>
              </label>

              <label class="tag-option">
                <input
                  type="radio"
                  name="noteTag"
                  value="reminders"
                  class="tag-radio"
                />

                <span class="tag-label tag-reminders">
                  <i class="fas fa-bell"></i> Reminder
                </span>
              </label>
            </div>
          </div>

          <button type="submit" class="submit-btn">
            Save Note
          </button>
        </form>
      </div>
    </div>

    <!-- Delete confirmation modal -->
    <div id="confirmModal" class="modal-overlay">
      <div class="modal confirmation-modal">
        <div class="modal-body">
          <p class="confirmation-text">
            Are you sure you want to delete this note?
          </p>

          <div class="confirmation-buttons">
            <button
              id="cancelDeleteBtn"
              class="confirmation-btn cancel-btn"
            >
              Cancel
            </button>

            <button
              id="confirmDeleteBtn"
              class="confirmation-btn confirm-btn"
            >
              Delete
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Supabase JavaScript library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="./index.js"></script>


  </body>
</html>
